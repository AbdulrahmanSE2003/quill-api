  url: "{{URL}}/stats/session"
  body:
    type: json
    data: |-
      {
        "bookId": "6a6d2e8f5cbbb2c9192c136f",
        "minutesRead": 15,
        "chunksRead": 3,
        "wordsRead": 1500,
