info:
  name: Register
  type: http
  seq: 1

http:
  method: POST
  url: "{{URL}}/auth/register"
  body:
    type: json
    data: |-
      {
        "name":"abdo",
        "email":"abdo@gmail.com",
        "password":"pass1234",
        "passwordConfirm":"pass1234"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
